<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 476" width="960" height="476" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">How Larimar works</title>
  <desc id="desc">Agents on your Mac send connect requests to the Larimar daemon through the CLI. The CLI exits after waiting for connection; the daemon keeps the tunnels running. Repeated connect requests for the same tunnel ID share one tunnel, including requests from multiple agents. Tools on the server can also request new tunnels; you approve them on your Mac.</desc>
  <style>
    .bg{fill:#ffffff}
    .panel{fill:#f6f8fa;stroke:#d0d7de}
    .box{fill:#ffffff;stroke:#d0d7de}
    .core{fill:#ffffff;stroke:#1f2328;stroke-width:1.5}
    .databox{fill:#e3f6f5;stroke:#0e7c86}
    .ctlbox{fill:#fff8e1;stroke:#9a6700}
    .data{stroke:#0e7c86;fill:none;stroke-width:1.75}
    .ctl{stroke:#9a6700;fill:none;stroke-width:1.5;stroke-dasharray:5 4}
    .dataf{fill:#0e7c86}
    .ctlf{fill:#9a6700}
    .t{fill:#1f2328;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",Helvetica,Arial,sans-serif;font-size:12px}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .m{fill:#59636e}
    .a{fill:#0e7c86}
    .c{fill:#9a6700}
    .b{font-weight:600}
    .mid{text-anchor:middle}
    .end{text-anchor:end}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}
      .panel{fill:#161b22;stroke:#30363d}
      .box{fill:#0d1117;stroke:#3d444d}
      .core{fill:#0d1117;stroke:#e6edf3}
      .databox{fill:#0b2e31;stroke:#3ec7cf}
      .ctlbox{fill:#2e2206;stroke:#d29922}
      .data{stroke:#3ec7cf}
      .ctl{stroke:#d29922}
      .dataf{fill:#3ec7cf}
      .ctlf{fill:#d29922}
      .t{fill:#e6edf3}
      .m{fill:#9198a1}
      .a{fill:#3ec7cf}
      .c{fill:#d29922}
    }
  </style>
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dataf"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ctlf"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="476"/>


  <g transform="translate(0 -64)">
  <!-- Panels -->
  <rect class="panel" x="24" y="80" width="540" height="408" rx="12"/>
  <text class="t b" x="44" y="106" style="font-size:14px">Your Mac</text>
  <rect class="panel" x="640" y="80" width="296" height="408" rx="12"/>
  <text class="t b" x="660" y="106" style="font-size:14px">devbox (SSH server)</text>

  <!-- Traffic path -->
  <rect class="box" x="48" y="128" width="130" height="64" rx="8"/>
  <text class="t b mid" x="113" y="156" style="font-size:14px">Browser</text>
  <text class="t m mid" x="113" y="176">or database client</text>
  <line class="data" x1="178" y1="160" x2="198" y2="160" marker-end="url(#ad)"/>
  <text class="t a b" x="48" y="214" style="font-size:11px">Open local URL</text>

  <rect class="databox" x="200" y="124" width="124" height="72" rx="8"/>
  <text class="t mono b mid" x="262" y="146">localhost</text>
  <text class="t mono mid" x="262" y="166" style="font-size:11px">:3000 dev-web</text>
  <text class="t mono mid" x="262" y="184" style="font-size:11px">:4980 your_tool</text>
  <line class="data" x1="324" y1="160" x2="346" y2="160" marker-end="url(#ad)"/>

  <rect class="databox" x="348" y="116" width="176" height="88" rx="8"/>
  <text class="t mono b mid" x="436" y="154" style="font-size:13px">/usr/bin/ssh -L</text>
  <text class="t m mid" x="436" y="184" style="font-size:11px">~/.ssh/config</text>

  <rect class="databox" x="524" y="148" width="140" height="24" rx="12"/>
  <line class="data" x1="530" y1="160" x2="660" y2="160" marker-end="url(#ad)" style="stroke-width:2.5"/>
  <text class="t a b mid" x="602" y="140">SSH</text>

  <rect class="box" x="664" y="128" width="248" height="64" rx="8"/>
  <text class="t b mid" x="788" y="156" style="font-size:14px">sshd</text>
  <text class="t m mid" x="788" y="176">port 22</text>

  <line class="data" x1="723" y1="192" x2="723" y2="234" marker-end="url(#ad)"/>
  <line class="data" x1="853" y1="192" x2="853" y2="234" marker-end="url(#ad)"/>

  <rect class="box" x="664" y="236" width="118" height="56" rx="8"/>
  <text class="t b mid" x="723" y="260" style="font-size:13px">your app</text>
  <text class="t mono m mid" x="723" y="280" style="font-size:11px">:3000</text>

  <rect class="box" x="794" y="236" width="118" height="56" rx="8"/>
  <text class="t b mid" x="853" y="260" style="font-size:13px">your tool</text>
  <text class="t m mid" x="853" y="280" style="font-size:11px">:4980, by an agent</text>

  <!-- Larimar core and inputs -->
  <rect class="core" x="200" y="236" width="324" height="132" rx="10"/>
  <text class="t b mid" x="362" y="308" style="font-size:17px">Larimar daemon</text>

  <line class="ctl" x1="436" y1="236" x2="436" y2="207" marker-end="url(#ac)"/>
  <text class="t c" x="444" y="226" style="font-size:11px">Start / reconnect</text>

  <rect class="ctlbox" x="48" y="236" width="130" height="40" rx="8"/>
  <text class="t mono b mid" x="113" y="253">tunnels.toml</text>
  <text class="t m mid" x="113" y="268" style="font-size:10.5px">~/.config/larimar</text>
  <line class="ctl" x1="178" y1="256" x2="197" y2="256" marker-end="url(#ac)"/>

  <rect class="box" x="48" y="282" width="130" height="40" rx="8"/>
  <text class="t b mid" x="113" y="306">Menu bar app</text>
  <line class="ctl" x1="178" y1="302" x2="197" y2="302" marker-end="url(#ac)"/>

  <rect class="box" x="48" y="328" width="130" height="40" rx="8"/>
  <text class="t b mid" x="113" y="345">Agents on your Mac</text>
  <text class="t mono mid" x="113" y="360" style="font-size:10.5px">larimar connect</text>
  <line class="ctl" x1="178" y1="348" x2="197" y2="348" marker-end="url(#ac)"/>

  <!-- Control channel -->
  <rect class="ctlbox" x="200" y="400" width="324" height="64" rx="8"/>
  <text class="t mono b mid" x="362" y="426" style="font-size:13px">/usr/bin/ssh -R</text>
  <text class="t m mid" x="362" y="446" style="font-size:11px">control connection to devbox</text>
  <line class="ctl" x1="300" y1="400" x2="300" y2="371" marker-end="url(#ac)"/>
  <text class="t c" x="308" y="390" style="font-size:11px">Forward request</text>

  <rect class="ctlbox" x="524" y="420" width="140" height="24" rx="12"/>
  <line class="ctl" x1="660" y1="432" x2="530" y2="432" marker-end="url(#ac)"/>
  <text class="t c b mid" x="602" y="412">SSH</text>

  <rect class="ctlbox" x="664" y="400" width="248" height="64" rx="8"/>
  <text class="t mono b mid" x="788" y="426" style="font-size:13px">control.sock</text>
  <text class="t mono m mid" x="788" y="446" style="font-size:11px">~/.larimar/control.sock</text>

  <line class="ctl" x1="853" y1="292" x2="853" y2="397" marker-end="url(#ac)"/>
  <text class="t c b end" x="843" y="338" style="font-size:11px">POST request</text>
  <text class="t mono c end" x="843" y="354" style="font-size:11px">/v1/forwards</text>

  <!-- Legend -->
  <line class="data" x1="24" y1="516" x2="56" y2="516" marker-end="url(#ad)"/>
  <text class="t m" x="64" y="520">Traffic</text>
  <line class="ctl" x1="130" y1="516" x2="162" y2="516" marker-end="url(#ac)"/>
  <text class="t m" x="170" y="520">Control</text>
  </g>
</svg>
